[tool:pytest]
# pytest配置文件

# 测试文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 输出格式
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    performance: 性能测试
    slow: 慢速测试
    aws: AWS相关测试

# 测试目录
testpaths = .

# 最小版本要求
minversion = 6.0

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 覆盖率配置
addopts = 
    --cov=datakit_sync
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80 