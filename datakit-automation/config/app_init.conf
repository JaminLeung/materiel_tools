# Datakit应用初始化配置文件
# 版本: 1.0.0
# 描述: app_init.sh脚本的配置文件

[script]
# 脚本基本信息
name = "datakit_app_init"
version = "2.0.0"
log_file = "/opt/datakit/app_init.log"

[ops]
# 运维平台配置
config_py_file = "/usr/lib/zabbix/externalscripts/config.py"
api_url = "http://localhost:5000/api/v2/cmdb/observation-metadata"
dataway_url = "https://openway.guance.com?token=tkn_3a0052c9f6d3498c8ce9ca0988fd9c82"

[datakit]
# Datakit配置目录
logging_dir = "/usr/local/datakit/conf.d/logging"
metrics_dir = "/usr/local/datakit/conf.d/prom"
health_dir = "/usr/local/datakit/conf.d/host"

[backup]
# 备份配置
base_dir = "/opt/datakit/backup"
keep_days = 7

[templates]
# 模板文件配置
logging_template = "logging_template.conf"
metrics_template = "metrics_template.conf"
health_template = "health_template.conf"

[api]
# API调用配置
connect_timeout = 10
max_time = 30
random_delay_max = 60 